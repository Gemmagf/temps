name: Refresh observations and forecast

on:
  schedule:
    - cron: "15 * * * *"   # every hour at :15 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-hourly
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Recent + now hourly observations
        run: |
          python fetch.py --resolution h --period now
          python fetch.py --resolution h --period recent

      - name: Process observations
        run: python process.py

      - name: Open-Meteo daily + hourly forecast
        run: python forecast.py

      - name: Copy fresh JSON into web/public/data
        run: |
          mkdir -p web/public/data
          for f in stations.json hourly.json forecast.json hourly_forecast.json; do
            if [ -f "data/$f" ]; then cp "data/$f" "web/public/data/"; fi
          done

      - name: Commit & push if anything changed
        run: |
          git config user.name "weather-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add web/public/data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: refresh observations + forecast"
            git push
          fi
